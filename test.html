<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>测评进行中 · 口语力测评</title>
  <meta name="description" content="英语口语与听力在线测评答题页。" />
  <meta name="theme-color" content="#1c6b5a" />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231c6b5a'/%3E%3Cpath d='M16 7v9M11 11a5 5 0 0 0 10 0' stroke='white' stroke-width='2.2' fill='none' stroke-linecap='round'/%3E%3Cpath d='M9 24c2-1.6 4.5-2.4 7-2.4s5 .8 7 2.4' stroke='white' stroke-width='2.2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="test-shell">

  <!-- === Header（精简式，专注答题） === -->
  <header class="site-header">
    <div class="wrap nav">
      <a class="brand" href="index.html" aria-label="返回首页">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 3v10"/><path d="M8 6.5a4 4 0 0 0 8 0"/><path d="M6 19c2-1.6 4-2.4 6-2.4s4 .8 6 2.4"/></svg>
        </span>
        <span><span data-i18n="brand.name">口语力测评</span><small data-i18n="brand.sub">SPEAK ASSESS</small></span>
      </a>

      <div class="test-head" style="margin:0">
        <span class="tag" id="apiStatus" data-i18n="status.mockShort">演示模式</span>
        <span class="test-head__mode"><span data-i18n="common.mode">模式</span>: <b id="modeLabel">快速版</b></span>
        <span class="test-head__mode" id="counter" aria-live="polite">1 / 1</span>
      </div>

      <div style="display:flex;align-items:center;gap:10px">
        <div class="lang-switch" role="group" aria-label="语言切换">
          <button data-lang="zh" aria-pressed="true">中文</button>
          <button data-lang="en" aria-pressed="false">EN</button>
        </div>
        <button class="nav__toggle" id="navToggle" aria-expanded="false" aria-controls="navLinks" aria-label="菜单">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></svg>
        </button>
      </div>
    </div>
    <nav class="nav__links" id="navLinks" aria-label="主导航">
      <a href="index.html" data-i18n="nav.backHome">返回首页</a>
      <a href="index.html#levels" data-i18n="nav.levels">等级标准</a>
    </nav>
  </header>

  <!-- === 答题主体 === -->
  <main class="test-main">
    <div class="wrap wrap--narrow">
      <div class="progress" role="progressbar" aria-label="答题进度"><div class="progress__bar" id="progressBar"></div></div>
      <div id="stage" aria-live="polite"></div>

      <div class="btn-row" style="margin-top:26px;justify-content:space-between">
        <button class="btn btn--quiet" id="btnPrev" data-i18n="common.prev">上一题</button>
        <button class="btn btn--primary" id="btnNext" data-i18n="common.next">下一题</button>
      </div>
    </div>
  </main>

  <!-- === Footer === -->
  <footer class="site-footer" style="padding:24px 0">
    <div class="wrap footer-grid">
      <p class="footer-note" data-i18n="footer.credit">语音识别与口语评测由腾讯云提供。</p>
      <a class="footer-note" href="index.html" data-i18n="nav.backHome">返回首页</a>
    </div>
  </footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/core.js"></script>
  <script src="assets/js/recorder.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/scoring.js"></script>
  <script src="assets/js/test.js"></script>
  <script>
    /* 移动端导航开关 */
    (function () {
      const t = document.getElementById('navToggle');
      const n = document.getElementById('navLinks');
      if (!t || !n) return;
      t.addEventListener('click', () => {
        const open = n.classList.toggle('is-open');
        t.setAttribute('aria-expanded', String(open));
      });
      n.querySelectorAll('a').forEach((a) => a.addEventListener('click', () => {
        n.classList.remove('is-open');
        t.setAttribute('aria-expanded', 'false');
      }));
    })();
  </script>
</body>
</html>
